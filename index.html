<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doktorabc - Helfy</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/hero.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="topbar">
        <div class="topbar__inner">
            <span class="topbar__label">
                <span class="topbar__label--full">Why Doktorabc?</span>
                <span class="topbar__label--short">Why Us?</span>
            </span>
            <span class="topbar__sep" aria-hidden="true"></span>
            <div class="topbar__marquee" id="topbarMarquee">
                <div class="topbar__track" id="topbarTrack"></div>
            </div>
        </div>
    </div>
    <nav>
        <div class="nav__inner">
            <img src="./assets/icon.png" alt="Doktorabc Logo">
        </div>
    </nav>
    <section class="hero">
        <div class="hero__image">
            <img src="./assets/images/hero.png" alt="Hero Person Image">
        </div>
        <div class="hero__inner">
            <span class="hero__title">
                Online-Arzt- und Apothekenservice
            </span>
            <span class="hero__subtitle">
                Behandlungen online verschrieben und nach Hause geliefert
            </span>
            <ul class="hero__features">
                <li class="hero__feature">
                    Schneller und
                    <span class="hero__feature-bold">diskreter Service</span>
                </li>
                 <li class="hero__feature">
                    Rezept und
                    <span class="hero__feature-bold">Behandlung online </span>
                </li>
                 <li class="hero__feature">
                    Selbstabholung in
                    <span class="hero__feature-bold">600+ Apotheken</span>
                </li>
                 <li class="hero__feature">
                    Expresslieferung ab
                    <span class="hero__feature-bold">
                        60 Min
                        <span class="hero__feature-note">*je nach Standort</span>
                    </span>
                </li>
            </ul>
            <button class="hero__cta">
                Jetzt Rezept anfordern!
            </button>
            <div class="hero__review">
                <div class="hero__review-info">
                    <div class="hero__review-info-image">
                        <img src="./assets/images/hero_logo.png" alt="Review Image">
                    </div>
                    <div class="hero__review-info-text">
                        <span class="hero__review-info-text-name">
                            Käuferschutz
                            <img src="./assets/icons/stars.png" alt="Stars">
                            <img src="./assets/icons/stars.png" alt="Stars">
                            <img src="./assets/icons/stars.png" alt="Stars">
                            <img src="./assets/icons/stars.png" alt="Stars">
                            <img src="./assets/icons/stars.png" alt="Stars">
                        </span>
                        <span class="hero__review-info-text-rating">4,81 Sehr gut</span>

                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="./js/index.js"></script>
</body>
</html>
